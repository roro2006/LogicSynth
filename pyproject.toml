[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logicsynth"
version = "0.1.0"
description = "Deterministic heuristic optimization for Yosys JSON netlists"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
logicsynth = "logicsynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
