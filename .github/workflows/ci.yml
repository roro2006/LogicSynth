name: CI
on:
  push:
  pull_request:
jobs:
  build-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y yosys yosys-dev
      - run: make test
      - run: make yosys-test
      - run: make yosys-plugin
        name: Build native C++ Yosys plugin
      - run: make yosys-plugin-test
        name: Test native C++ Yosys plugin
      - run: make benchmark
        name: Generate native QoR comparison
      - run: test -s results/native/summary.json
        name: Validate machine-readable benchmark result
