name: CI
on:
  push:
  pull_request:
jobs:
  build-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y yosys yosys-dev
      - run: python -m pip install -e '.[test]'
      - run: make test
      - run: make yosys-test
      - run: make yosys-plugin
        name: Build native C++ Yosys plugin
      - run: make yosys-plugin-test
        name: Test native C++ Yosys plugin
